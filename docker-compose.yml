# Arcadia Editions microservices: shared infrastructure + the five services.
# Images come from ./build-images.sh (mvn spring-boot:build-image in each sibling repository).
# Ports: see README.md.

x-service-env: &service-env
  DATASOURCE_USERNAME: postgres
  DATASOURCE_PASSWORD: admin123
  KAFKA_BOOTSTRAP_SERVERS: kafka:19093
  SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081
  SPRING_JPA_HIBERNATE_DDL_AUTO: update

x-service: &service
  restart: on-failure
  depends_on:
    postgresql:
      condition: service_healthy
    kafka:
      condition: service_started
    schema-registry:
      condition: service_started

services:

  # --- infrastructure ---

  postgresql:
    image: postgres:16.3
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
    volumes:
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: EXTERNAL_PUBLIC://:9092,PLAINTEXT://:19093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL_PUBLIC://${HOST:-localhost}:9092,PLAINTEXT://kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL_PUBLIC:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.3
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19093
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # --- microservices ---

  orders-checkout-service:
    <<: *service
    image: orders-checkout-service-java:0.0.1-SNAPSHOT
    ports:
      - "8101:8101"
    environment:
      <<: *service-env
      SERVER_PORT: 8101
      DATASOURCE_URL: jdbc:postgresql://postgresql:5432/orders_checkout
      CATALOG_INVENTORY_URL: http://catalog-inventory-service:8102/api

  catalog-inventory-service:
    <<: *service
    image: catalog-inventory-service-java:0.0.1-SNAPSHOT
    ports:
      - "8102:8102"
    environment:
      <<: *service-env
      SERVER_PORT: 8102
      DATASOURCE_URL: jdbc:postgresql://postgresql:5432/catalog_inventory
      PAYMENTS_PROCESSING_URL: http://payments-processing-service:8103/api

  payments-processing-service:
    <<: *service
    image: payments-processing-service-java:0.0.1-SNAPSHOT
    ports:
      - "8103:8103"
    environment:
      <<: *service-env
      SERVER_PORT: 8103
      DATASOURCE_URL: jdbc:postgresql://postgresql:5432/payments_processing

  fulfillment-shipping-service:
    <<: *service
    image: fulfillment-shipping-service-java:0.0.1-SNAPSHOT
    ports:
      - "8104:8104"
    environment:
      <<: *service-env
      SERVER_PORT: 8104
      DATASOURCE_URL: jdbc:postgresql://postgresql:5432/fulfillment_shipping

  notifications-consumer-service:
    <<: *service
    image: notifications-consumer-service-java:0.0.1-SNAPSHOT
    ports:
      - "8105:8105"
    environment:
      <<: *service-env
      SERVER_PORT: 8105
      DATASOURCE_URL: jdbc:postgresql://postgresql:5432/notifications_consumer
